name: Ceremony Portal Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment environment."
        required: true
        type: choice
        options:
          - staging
          - production
      release_sha:
        description: "Exact 40-character admin-portal commit SHA."
        required: true
        type: string
      release_tag:
        description: "Annotated coordinated release tag resolving to release_sha."
        required: true
        type: string
      launch_profile:
        description: "Scope shown in release metadata; runtime policy is configured separately."
        required: false
        type: choice
        default: standard
        options:
          - standard
          - disposable-vault-identity
      rollback_release:
        description: "Verified immutable release ID: <40-char SHA>-<coordinated tag>."
        required: false
        type: string

concurrency:
  group: ceremony-portal-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.rollback_release == '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      SOLSLOT_GOOGLE_VAULT_ENABLED: ${{ vars.SOLSLOT_GOOGLE_VAULT_ENABLED || 'false' }}
      SOLSLOT_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.SOLSLOT_GOOGLE_OAUTH_CLIENT_ID || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify exact source
        run: |
          set -euo pipefail
          [[ "${{ inputs.release_sha }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.release_tag }}" =~ ^solslot-v2-alpha-rc[0-9]+(\.[0-9]+)?-[0-9]{8}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.release_sha }}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${{ inputs.release_sha }}" origin/main
          git fetch --force origin \
            "refs/tags/${{ inputs.release_tag }}:refs/tags/${{ inputs.release_tag }}"
          test "$(git rev-list -n 1 "${{ inputs.release_tag }}")" \
            = "${{ inputs.release_sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and validate
        run: |
          set -euo pipefail
          npm ci
          python3 scripts/check_release_identity_workflow.py \
            .github/workflows/deploy-ceremony-portal.yml portal
          python3 scripts/check_namespace.py
          npm run security:headers
          npm run security:eip712-exports
          npm run security:google-bls
          npm audit --omit=dev --audit-level=high
          npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build ceremony portal
        run: |
          set -euo pipefail
          if [ "${{ inputs.target }}" = "production" ]; then
            npm run build:ceremony-locked
          else
            npm run build:ceremony
          fi
          out="dist/solslot-portal/browser"
          test -f "$out/index.html"
          runtime_config_sha256="$(sha256sum src/environments/google-vault-runtime.ts | awk '{print $1}')"
          recovery_manifest_sha256="$(node scripts/write-recovery-page-manifest.mjs "$out")"
          RUNTIME_CONFIG_SHA256="$runtime_config_sha256" \
          RECOVERY_MANIFEST_SHA256="$recovery_manifest_sha256" \
          node - "$out/release.json" <<'NODE'
          const fs = require("fs");
          const output = process.argv[2];
          fs.writeFileSync(output, JSON.stringify({
            schemaVersion: 1,
            release: "${{ inputs.release_tag }}",
            repository: process.env.GITHUB_REPOSITORY,
            commit: "${{ inputs.release_sha }}",
            environment: "${{ inputs.target }}",
            baseHref: "/genesis-admin/",
            testOnly: true,
            auditStatus: "${{ inputs.launch_profile }}" === "disposable-vault-identity"
              ? "internal-engineering-testnet-pending-external-review"
              : "final-independent-approval-confirmed",
            launchProfile: "${{ inputs.launch_profile || 'standard' }}",
            activationStatus: "pending-runtime-enrollment",
            serverWritesExpectedLocked: true,
            mintingExpectedLocked: true,
            ceremonyModeExpectedLocked: true,
            googleVaultEnabled: process.env.SOLSLOT_GOOGLE_VAULT_ENABLED === "true",
            googleVaultRuntimeConfigSha256: process.env.RUNTIME_CONFIG_SHA256,
            recoveryPageManifestSha256: process.env.RECOVERY_MANIFEST_SHA256
          }, null, 2) + "\n");
          NODE
          node scripts/render-apache-headers.mjs --output "$out/.htaccess" --base-href /genesis-admin/
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner -czf \
            "solslot-admin-${{ inputs.release_sha }}-${{ inputs.release_tag }}.tgz" \
            -C "$out" .
          sha256sum \
            "solslot-admin-${{ inputs.release_sha }}-${{ inputs.release_tag }}.tgz" \
            > "solslot-admin-${{ inputs.release_sha }}-${{ inputs.release_tag }}.tgz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: solslot-admin-${{ inputs.release_sha }}-${{ inputs.release_tag }}
          path: |
            solslot-admin-${{ inputs.release_sha }}-${{ inputs.release_tag }}.tgz
            solslot-admin-${{ inputs.release_sha }}-${{ inputs.release_tag }}.tgz.sha256
          retention-days: 30

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "solslot-admin-${{ inputs.release_sha }}-${{ inputs.release_tag }}.tgz,solslot-admin-${{ inputs.release_sha }}-${{ inputs.release_tag }}.tgz.sha256"
          target: /tmp

  deploy:
    if: ${{ inputs.rollback_release == '' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Activate ceremony portal
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            sha="${{ inputs.release_sha }}"
            tag="${{ inputs.release_tag }}"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$tag" =~ ^solslot-v2-alpha-rc[0-9]+(\.[0-9]+)?-[0-9]{8}$ ]]
            release_id="$sha-$tag"
            root="${{ vars.SOLSLOT_ADMIN_RELEASE_ROOT }}"
            mount_path="${{ vars.SOLSLOT_ADMIN_MOUNT_PATH }}"
            public_url="${{ vars.SOLSLOT_ADMIN_PUBLIC_URL }}"
            expected_host="${{ vars.SOLSLOT_ADMIN_EXPECTED_HOSTNAME }}"
            archive="/tmp/solslot-admin-$release_id.tgz"
            release_dir="$root/releases/$release_id"
            test -n "$root"
            test -n "$mount_path"
            test -n "$public_url"
            test -n "$expected_host"
            case "$mount_path" in
              /*/genesis-admin) ;;
              *)
                echo "SOLSLOT_ADMIN_MOUNT_PATH must be an absolute genesis-admin path." >&2
                exit 1
                ;;
            esac
            test "$(hostname)" = "$expected_host"
            test -d "$(dirname "$mount_path")"
            if [ -e "$mount_path" ] && [ ! -L "$mount_path" ]; then
              echo "Refusing to replace non-symlink admin mount $mount_path." >&2
              exit 1
            fi
            cd /tmp
            sha256sum -c "$(basename "$archive").sha256"
            artifact_sha256="$(sha256sum "$archive" | awk '{print $1}')"
            sudo mkdir -p "$root/releases"

            verify_release() {
              python3 - \
                "$1/release.json" \
                "$1/recovery-page-manifest.json" \
                "$sha" "$tag" <<'PY'
            import json, sys
            release = json.load(open(sys.argv[1], encoding="utf-8"))
            recovery = json.load(open(sys.argv[2], encoding="utf-8"))
            assert release["commit"] == sys.argv[3]
            assert release["release"] == sys.argv[4]
            assert release["serverWritesExpectedLocked"] is True
            assert release["mintingExpectedLocked"] is True
            assert release["ceremonyModeExpectedLocked"] is True
            assert release["recoveryPageManifestSha256"] == recovery["aggregateSha256"]
            PY
            }

            if [ -e "$release_dir" ] && [ ! -d "$release_dir" ]; then
              echo "Release path exists and is not a directory: $release_dir" >&2
              exit 1
            fi
            if [ -f "$release_dir/.release-ready" ]; then
              verify_release "$release_dir"
              test -f "$release_dir/.artifact-sha256"
              test "$(cat "$release_dir/.artifact-sha256")" = "$artifact_sha256"
            else
              if [ -e "$release_dir" ]; then
                echo "Refusing to replace incomplete release: $release_dir" >&2
                exit 1
              fi
              incoming_dir="$root/releases/.incoming-$release_id-$$"
              cleanup_incoming() {
                sudo rm -rf "$incoming_dir"
              }
              trap cleanup_incoming EXIT
              sudo mkdir -p "$incoming_dir"
              sudo tar -xzf "$archive" -C "$incoming_dir"
              verify_release "$incoming_dir"
              printf '%s\n' "$artifact_sha256" \
                | sudo tee "$incoming_dir/.artifact-sha256" >/dev/null
              sudo touch "$incoming_dir/.release-ready"
              sudo mv -T "$incoming_dir" "$release_dir"
              trap - EXIT
            fi
            verify_release "$release_dir"
            previous="$(readlink -f "$root/current" || true)"
            sudo ln -sfn "$release_dir" "$root/current.next"
            sudo mv -Tf "$root/current.next" "$root/current"
            sudo ln -sfn "$root/current" "$mount_path.next"
            sudo mv -Tf "$mount_path.next" "$mount_path"
            sudo systemctl reload apache2
            verify_host="${public_url#https://}"
            verify_host="${verify_host%%/*}"
            verify_url="https://$verify_host/genesis-admin/release.json"
            curl_args=(--resolve "$verify_host:443:127.0.0.1")
            if ! curl -fsS --retry 12 --retry-delay 2 --retry-all-errors \
              --max-time 90 "${curl_args[@]}" "$verify_url" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["commit"] == "${{ inputs.release_sha }}"; assert d["release"] == "${{ inputs.release_tag }}"'; then
              if [ -n "$previous" ] && [ -f "$previous/.release-verified" ]; then
                sudo ln -sfn "$previous" "$root/current.next"
                sudo mv -Tf "$root/current.next" "$root/current"
                sudo systemctl reload apache2
              fi
              exit 1
            fi
            sudo touch "$release_dir/.release-verified"
            # Release evidence is under preservation hold. Retain prior releases
            # for review and rollback; cleanup requires separate authorization.

  rollback:
    if: ${{ inputs.rollback_release != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Reactivate verified ceremony portal
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            release_id="${{ inputs.rollback_release }}"
            [[ "$release_id" =~ ^[0-9a-f]{40}-solslot-v2-alpha-rc[0-9]+(\.[0-9]+)?-[0-9]{8}$ ]]
            sha="${release_id%%-*}"
            tag="${release_id#"$sha"-}"
            root="${{ vars.SOLSLOT_ADMIN_RELEASE_ROOT }}"
            mount_path="${{ vars.SOLSLOT_ADMIN_MOUNT_PATH }}"
            release_dir="$root/releases/$release_id"
            test -f "$release_dir/.release-ready"
            test -f "$release_dir/.release-verified"
            test -f "$release_dir/.artifact-sha256"
            python3 - "$release_dir/release.json" "$sha" "$tag" <<'PY'
            import json, sys
            release = json.load(open(sys.argv[1], encoding="utf-8"))
            assert release["commit"] == sys.argv[2]
            assert release["release"] == sys.argv[3]
            assert release["serverWritesExpectedLocked"] is True
            assert release["mintingExpectedLocked"] is True
            assert release["ceremonyModeExpectedLocked"] is True
            PY
            previous="$(readlink -f "$root/current" || true)"
            sudo ln -sfn "$release_dir" "$root/current.next"
            sudo mv -Tf "$root/current.next" "$root/current"
            test -d "$(dirname "$mount_path")"
            if [ -e "$mount_path" ] && [ ! -L "$mount_path" ]; then
              echo "Refusing to replace non-symlink admin mount $mount_path." >&2
              exit 1
            fi
            sudo ln -sfn "$root/current" "$mount_path.next"
            sudo mv -Tf "$mount_path.next" "$mount_path"
            sudo systemctl reload apache2
            public_url="${{ vars.SOLSLOT_ADMIN_PUBLIC_URL }}"
            verify_host="${public_url#https://}"
            verify_host="${verify_host%%/*}"
            verify_url="https://$verify_host/genesis-admin/release.json"
            curl_args=(--resolve "$verify_host:443:127.0.0.1")
            if ! curl -fsS --retry 12 --retry-delay 2 --retry-all-errors \
              --max-time 90 "${curl_args[@]}" "$verify_url" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["commit"] == "'"$sha"'"; assert d["release"] == "'"$tag"'"'; then
              if [ -n "$previous" ] \
                && [ "$previous" != "$release_dir" ] \
                && [ -f "$previous/.release-verified" ]; then
                sudo ln -sfn "$previous" "$root/current.next"
                sudo mv -Tf "$root/current.next" "$root/current"
                sudo systemctl reload apache2
              fi
              exit 1
            fi
